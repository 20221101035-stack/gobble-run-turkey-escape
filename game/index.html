<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gobble Run — The Great Thanksgiving Escape</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #2a1a0c;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #wrap {
        position: relative;
        width: min(100vw, 177.78vh);
        aspect-ratio: 16 / 9;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto;
        cursor: pointer;
        background: #ffd28a;
      }
      #hint {
        position: absolute;
        left: 12px;
        bottom: 8px;
        color: rgba(255, 233, 196, 0.8);
        font-size: 12px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="hint">Gobble Run — an original turkey escape game. No network, no libraries.</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
